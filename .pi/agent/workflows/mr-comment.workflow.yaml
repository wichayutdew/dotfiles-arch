version: 1
id: mr-comment
command: mr-comment
description: Fetch unresolved MR or PR comments, approve a fix plan, implement,
  verify, push, and reply
start: fetch
maxStepVisits: 10
summaryMaxChars: 30000
steps:
  fetch:
    title: Fetch merge-request or pull-request evidence
    prompt:
      file: steps/mr-comment/fetch.md
    agent: scout
    permissions: &a1
      tools:
        - read
        - ls
        - bash
        - edit
        - write
        - mcp
      mcp:
        - context7
        - atlassian
        - gitlab
        - figma
        - agoda_skills
        - glean
        - sourcegraph
        - grafana
        - slack
        - gh_grep
        - superset
      extensions:
        - /
      skills:
        - brainstorming
        - cavecrew
        - caveman
        - caveman-commit
        - caveman-compress
        - caveman-help
        - caveman-review
        - caveman-stats
        - coding-standards
        - commit-format
        - dispatching-parallel-agents
        - doc-templates
        - executing-plans
        - finishing-a-development-branch
        - grafana-logs
        - jira-ticket
        - lint-commands
        - plannotator-compound
        - plannotator-setup-goal
        - plannotator-visual-explainer
        - receiving-code-review
        - requesting-code-review
        - search-code-sourcegraph
        - start-on-call
        - start-triage
        - subagent-driven-development
        - systematic-debugging
        - test-driven-development
        - using-git-worktrees
        - using-superpowers
        - verification-before-completion
        - writing-plans
        - writing-skills
      bash:
        mode: unrestricted
    transitions:
      ready: checkout-source
      retry: fetch
      blocked: $pause
  checkout-source:
    title: Check out the reviewed source branch
    prompt:
      file: steps/mr-comment/checkout-source.md
    agent: worker
    workspace:
      bindOn:
        - ready
      allowedRoots:
        - ~/repositories/worktrees
        - .
    permissions: *a1
    transitions:
      ready: plan
      retry: checkout-source
      blocked: $pause
  plan:
    title: Propose a complete review-comment fix plan
    prompt:
      file: steps/mr-comment/plan.md
    agent: planner
    permissions: *a1
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: implement
      changes-requested: plan
      retry: plan
      blocked: $pause
  implement:
    title: Implement approved review-comment fixes
    prompt:
      file: steps/mr-comment/implement.md
    agent: worker
    permissions: *a1
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify review-comment handling
    prompt:
      file: steps/mr-comment/verify.md
    agent: reviewer
    permissions: *a1
    transitions:
      ready: deliver
      no-actions: $done
      failed: implement
      retry: verify
      blocked: verify
  deliver:
    title: Push the verified commit and reply to review comments
    prompt:
      file: steps/mr-comment/publish.md
    agent: worker
    permissions: *a1
    transitions:
      published: $done
      no-actions: $done
      retry: deliver
      superseded: $pause
      blocked: $pause
