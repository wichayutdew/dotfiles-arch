version: 1
id: mr-comment
command: mr-comment
description: "PR/MR URL → comments plan → fix → verify → push and reply."
start: fetch
maxStepVisits: 10
summaryMaxChars: 30000
steps:
  fetch:
    title: Fetch PR/MR evidence
    prompt: {file: steps/mr-comment/fetch.md}
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, context7]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: checkout-source, retry: fetch, blocked: $pause}
  checkout-source:
    title: Check out the source branch
    prompt: {file: steps/mr-comment/checkout-source.md}
    agent: scout
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees, .]
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: []
      skills: [using-git-worktrees]
      bash: {mode: unrestricted}
    transitions: {ready: plan, retry: checkout-source, blocked: $pause}
  plan:
    title: Decide each review comment
    prompt: {file: steps/mr-comment/plan.md}
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, sourcegraph, context7]
      extensions: []
      skills: [receiving-code-review]
      bash: {mode: unrestricted}
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 10000
        requiredSubstrings:
          - "## Comments"
          - "### Suggestion"
          - "### Verdict"
          - "### Response message"
          - "### Metadata"
          - "## Implementation plan"
          - "## Validation"
          - "## Execution appendix (machine-readable)"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions: {approved: implement, changes-requested: plan, retry: plan, blocked: $pause}
  implement:
    title: Apply approved comment fixes
    prompt: {file: steps/mr-comment/implement.md}
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [context7]
      extensions: []
      skills: [test-driven-development]
      bash: {mode: unrestricted}
    transitions: {ready: verify, retry: implement, blocked: $pause}
  verify:
    title: Check reviewer intent
    prompt: {file: steps/mr-comment/verify.md}
    agent: reviewer
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: []
      skills: [verification-before-completion]
      bash: {mode: unrestricted}
    transitions: {passed: deliver, no-actions: $done, failed: implement, retry: verify, blocked: verify}
  deliver:
    title: Push and reply
    prompt: {file: steps/mr-comment/publish.md}
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, github/add_issue_comment, github/add_reply_to_pull_request_comment, github/add_comment_to_pending_review]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {published: $done, no-actions: $done, retry: deliver, superseded: $pause, blocked: $pause}
