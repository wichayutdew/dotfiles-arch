version: 1
id: jira
command: jira
description: Draft, approve, and create a Jira Epic with ordered Stories
start: draft
maxStepVisits: 12
summaryMaxChars: 30000
steps:
  draft:
    title: Normalize Epic and Story input
    prompt:
      file: steps/jira/draft.md
    agent: scout
    permissions: &a1
      tools:
        - read
        - ls
        - bash
        - edit
        - write
        - mcp
      mcp:
        - context7
        - atlassian
        - gitlab
        - figma
        - agoda_skills
        - glean
        - sourcegraph
        - grafana
        - slack
        - gh_grep
        - superset
      extensions:
        - /
      skills:
        - brainstorming
        - cavecrew
        - caveman
        - caveman-commit
        - caveman-compress
        - caveman-help
        - caveman-review
        - caveman-stats
        - coding-standards
        - commit-format
        - dispatching-parallel-agents
        - doc-templates
        - executing-plans
        - finishing-a-development-branch
        - grafana-logs
        - jira-ticket
        - lint-commands
        - plannotator-compound
        - plannotator-setup-goal
        - plannotator-visual-explainer
        - receiving-code-review
        - requesting-code-review
        - search-code-sourcegraph
        - start-on-call
        - start-triage
        - subagent-driven-development
        - systematic-debugging
        - test-driven-development
        - using-git-worktrees
        - using-superpowers
        - verification-before-completion
        - writing-plans
        - writing-skills
      bash:
        mode: unrestricted
    transitions:
      ready: plan
      retry: draft
      blocked: $pause
  plan:
    title: Validate Jira schema and approve Epic and Story plan
    prompt:
      file: steps/jira/plan.md
    agent: planner
    permissions: *a1
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: create
      changes-requested: plan
      retry: plan
      blocked: $pause
  create:
    title: Create approved Jira Epic and Stories
    prompt:
      file: steps/jira/create.md
    agent: worker
    permissions: *a1
    transitions:
      ready: $done
      retry: create
      blocked: $pause
