version: 1
id: investigate
command: investigate
description: Derive, approve, investigate, and independently validate an
  evidence-backed finding
start: retrieve
maxStepVisits: 12
summaryMaxChars: 30000
steps:
  retrieve:
    title: Retrieve investigation scope and Jira evidence
    prompt:
      file: steps/investigate/retrieve.md
    agent: scout
    permissions: &a1
      tools:
        - read
        - ls
        - bash
        - edit
        - write
        - mcp
      mcp:
        - context7
        - atlassian
        - gitlab
        - figma
        - agoda_skills
        - glean
        - sourcegraph
        - grafana
        - slack
        - gh_grep
        - superset
      extensions:
        - /
      skills:
        - brainstorming
        - cavecrew
        - caveman
        - caveman-commit
        - caveman-compress
        - caveman-help
        - caveman-review
        - caveman-stats
        - coding-standards
        - commit-format
        - dispatching-parallel-agents
        - doc-templates
        - executing-plans
        - finishing-a-development-branch
        - grafana-logs
        - jira-ticket
        - lint-commands
        - plannotator-compound
        - plannotator-setup-goal
        - plannotator-visual-explainer
        - receiving-code-review
        - requesting-code-review
        - search-code-sourcegraph
        - start-on-call
        - start-triage
        - subagent-driven-development
        - systematic-debugging
        - test-driven-development
        - using-git-worktrees
        - using-superpowers
        - verification-before-completion
        - writing-plans
        - writing-skills
      bash:
        mode: unrestricted
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: investigate
      changes-requested: retrieve
      retry: retrieve
      blocked: $pause
  investigate:
    title: Investigate approved scope and write findings
    prompt:
      file: steps/investigate/investigate.md
    agent: worker
    permissions: *a1
    transitions:
      ready: validate
      retry: investigate
      blocked: $pause
  validate:
    title: Independently validate investigation findings
    prompt:
      file: steps/investigate/validate.md
    agent: reviewer
    permissions: *a1
    transitions:
      approved: $done
      gaps: investigate
      retry: validate
      blocked: validate
