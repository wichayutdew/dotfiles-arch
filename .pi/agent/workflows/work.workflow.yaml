version: 1
id: work
command: work
description: Prepare a dedicated workspace, plan, implement, and verify local work
start: prepare-workspace
maxStepVisits: 20
summaryMaxChars: 30000
steps:
  prepare-workspace:
    title: Prepare dedicated branch and worktree
    prompt:
      file: steps/shared/prepare-workspace.md
    subagent:
      agent: worker
      context: fresh
      timeoutMs: 900000
      retryToolFailures: true
      turnBudget:
        maxTurns: 25
        graceTurns: 3
      toolBudget:
        soft: 50
        hard: 90
        block: "*"
    workspace:
      bindOn:
        - ready
      allowedRoots:
        - ~/repositories/worktrees
    permissions: &a1
      tools:
        - read
        - ls
        - bash
        - edit
        - write
        - mcp
      mcp:
        - context7
        - atlassian
        - gitlab
        - figma
        - agoda_skills
        - glean
        - sourcegraph
        - grafana
        - slack
        - gh_grep
        - superset
      extensions:
        - /
      skills:
        - brainstorming
        - cavecrew
        - caveman
        - caveman-commit
        - caveman-compress
        - caveman-help
        - caveman-review
        - caveman-stats
        - coding-standards
        - commit-format
        - dispatching-parallel-agents
        - doc-templates
        - executing-plans
        - finishing-a-development-branch
        - grafana-logs
        - jira-ticket
        - lint-commands
        - plannotator-compound
        - plannotator-setup-goal
        - plannotator-visual-explainer
        - receiving-code-review
        - requesting-code-review
        - search-code-sourcegraph
        - start-on-call
        - start-triage
        - subagent-driven-development
        - systematic-debugging
        - test-driven-development
        - using-git-worktrees
        - using-superpowers
        - verification-before-completion
        - writing-plans
        - writing-skills
      bash:
        mode: unrestricted
    transitions:
      ready: plan
      retry: prepare-workspace
      blocked: $pause
  plan:
    title: Explore and plan local work
    prompt:
      file: steps/work/plan.md
    subagent:
      agent: planner
      context: fresh
      timeoutMs: 1200000
      retryToolFailures: true
      turnBudget:
        maxTurns: 30
        graceTurns: 3
      toolBudget:
        soft: 60
        hard: 100
        block: "*"
    permissions: *a1
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: implement
      changes-requested: plan
      workspace-refresh: prepare-workspace
      retry: plan
      blocked: $pause
  implement:
    title: Implement the approved local plan
    prompt:
      file: steps/work/implement.md
    subagent:
      agent: worker
      context: fresh
      timeoutMs: 7200000
      artifacts: true
      retryToolFailures: true
      turnBudget:
        maxTurns: 80
        graceTurns: 5
      toolBudget:
        soft: 240
        hard: 400
        block: "*"
    permissions: *a1
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify local work
    prompt:
      file: steps/work/verify.md
    subagent:
      agent: reviewer
      context: fresh
      timeoutMs: 3600000
      retryToolFailures: true
      turnBudget:
        maxTurns: 40
        graceTurns: 3
      toolBudget:
        soft: 120
        hard: 200
        block: "*"
    permissions: *a1
    transitions:
      passed: $done
      failed: implement
      retry: verify
      blocked: verify
