version: 1
id: mr-review
command: mr-review
description: "PR/MR URL → review findings → approve comments → publish."
start: fetch
maxStepVisits: 10
summaryMaxChars: 50000
steps:
  fetch:
    title: Fetch PR/MR evidence
    prompt: {file: steps/mr-review/fetch.md}
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, context7]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {fetched: review, blocked: $pause}
  review:
    title: Find bugs, leaks, and design issues
    prompt: {file: steps/mr-review/findings.md}
    agent: reviewer
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, sourcegraph, context7]
      extensions: []
      skills: [caveman-review, ponytail-review]
      bash: {mode: unrestricted}
    transitions: {ready: plan, retry: review, blocked: $pause}
  plan:
    title: Approve review comments
    prompt: {file: steps/mr-review/plan.md}
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, sourcegraph, context7]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 8000
        requiredSubstrings:
          - "## Review "
          - "- **Path / line:**"
          - "- **Detailed suggestion:**"
          - "- **Verdict:**"
          - "- **Comment:**"
          - "## Publication contract"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions: {approved: publish, changes-requested: plan, retry: plan, blocked: $pause}
  publish:
    title: Publish approved review comments
    prompt: {file: steps/mr-review/publish-approved.md}
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_review_write, github/add_comment_to_pending_review]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {published: $done, retry: publish, blocked: $pause}
