version: 1
id: mr-review
command: mr-review
description: "Fetch, approve, publish, and verify one hosted code review. Example: /mr-review https://gitlab.com/org/repo/-/merge_requests/123"
start: fetch
maxStepVisits: 10
summaryMaxChars: 50000
steps:
  fetch:
    title: Fetch complete hosted-review evidence
    prompt:
      file: steps/mr-review/fetch.md
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, context7]
      extensions: [/]
      skills: [using-superpowers, caveman]
      bash:
        mode: unrestricted
    transitions:
      fetched: review
      blocked: $pause
  review:
    title: Produce and approve the complete hosted review
    prompt:
      file: steps/mr-review/review-for-approval.md
    agent: reviewer
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, sourcegraph, context7]
      extensions: [/]
      skills: [using-superpowers, caveman, caveman-review, ponytail-review]
      bash:
        mode: unrestricted
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 8000
        requiredSubstrings:
          - "# Review:"
          - "## Verdict"
          - "## Findings"
          - "## Validation"
          - "## Publication contract"
          - "## Safety boundaries"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions:
      approved: publish
      changes-requested: review
      retry: review
      blocked: $pause
  publish:
    title: Publish the approved hosted review
    prompt:
      file: steps/mr-review/publish-approved.md
    agent: worker
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_review_write, github/add_comment_to_pending_review]
      extensions: [/]
      skills: [using-superpowers, caveman]
      bash:
        mode: unrestricted
    transitions:
      published: verify
      blocked: $pause
  verify:
    title: Verify or return the approved review for publication repair
    prompt:
      file: steps/mr-review/verify-published.md
    agent: reviewer
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read]
      extensions: [/]
      skills: [using-superpowers, caveman, verification-before-completion]
      bash:
        mode: unrestricted
    transitions:
      verified: $done
      failed: publish
      retry: verify
      blocked: verify
