version: 1
id: ticket
command: ticket
description: "Prepare a dedicated workspace, plan, implement, and verify a Jira ticket. Example: /ticket ACTB-2824 Fix missing client-id header in MSE requests"
start: prepare-workspace
maxStepVisits: 20
summaryMaxChars: 30000
steps:
  prepare-workspace:
    title: Prepare dedicated branch and worktree
    prompt:
      file: steps/shared/prepare-workspace.md
    agent: workspace-preparer
    workspace:
      bindOn:
        - ready
      allowedRoots:
        - ~/repositories/worktrees
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: [/]
      skills: [using-superpowers, using-git-worktrees, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: plan
      retry: prepare-workspace
      blocked: $pause
  plan:
    title: Read Jira evidence and plan
    prompt:
      file: steps/ticket/plan.md
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, context7, sourcegraph, glean, gitlab, github/get_file_contents]
      extensions: [/]
      skills: [using-superpowers, caveman, ponytail]
      bash:
        mode: unrestricted
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 10000
        requiredSubstrings:
          - "## Review summary"
          - "## Review focus"
          - "## Proposed approach"
          - "## Validation"
          - "## Risks"
          - "## Execution appendix (machine-readable)"
          - "## Publication contract"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions:
      approved: implement
      changes-requested: plan
      workspace-refresh: prepare-workspace
      retry: plan
      blocked: $pause
  implement:
    title: Implement the approved Jira plan
    prompt:
      file: steps/ticket/implement.md
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [context7]
      extensions: [/]
      skills: [using-superpowers, caveman, test-driven-development, systematic-debugging]
      bash:
        mode: unrestricted
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify Jira work
    prompt:
      file: steps/ticket/verify.md
    agent: reviewer
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: [/]
      skills: [using-superpowers, caveman, verification-before-completion, caveman-review, ponytail-review]
      bash:
        mode: unrestricted
    transitions:
      passed: publish
      failed: implement
      retry: verify
      blocked: verify
  publish:
    title: Publish verified branch and open review
    prompt:
      file: steps/shared/publish-remote.md
    agent: worker
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, github/create_pull_request]
      extensions: [/]
      skills: [using-superpowers, caveman, verification-before-completion]
      bash:
        mode: unrestricted
    transitions:
      published: $done
      retry: publish
      blocked: $pause
