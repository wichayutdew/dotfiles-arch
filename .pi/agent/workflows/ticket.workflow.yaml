version: 1
id: ticket
command: ticket
description: Prepare a dedicated workspace, plan, implement, and verify a Jira ticket
start: prepare-workspace
maxStepVisits: 20
summaryMaxChars: 30000
steps:
  prepare-workspace:
    title: Prepare dedicated branch and worktree
    prompt:
      file: steps/shared/prepare-workspace.md
    agent: worker
    workspace:
      bindOn:
        - ready
      allowedRoots:
        - ~/repositories/worktrees
    permissions: &a1
      tools:
        - read
        - ls
        - bash
        - edit
        - write
        - mcp
      mcp:
        - context7
        - atlassian
        - gitlab
        - figma
        - agoda_skills
        - glean
        - sourcegraph
        - grafana
        - slack
        - gh_grep
        - superset
      extensions:
        - /
      skills:
        - brainstorming
        - cavecrew
        - caveman
        - caveman-commit
        - caveman-compress
        - caveman-help
        - caveman-review
        - caveman-stats
        - coding-standards
        - commit-format
        - dispatching-parallel-agents
        - doc-templates
        - executing-plans
        - finishing-a-development-branch
        - grafana-logs
        - jira-ticket
        - lint-commands
        - plannotator-compound
        - plannotator-setup-goal
        - plannotator-visual-explainer
        - receiving-code-review
        - requesting-code-review
        - search-code-sourcegraph
        - start-on-call
        - start-triage
        - subagent-driven-development
        - systematic-debugging
        - test-driven-development
        - using-git-worktrees
        - using-superpowers
        - verification-before-completion
        - writing-plans
        - writing-skills
      bash:
        mode: unrestricted
    transitions:
      ready: plan
      retry: prepare-workspace
      blocked: $pause
  plan:
    title: Read Jira evidence and plan
    prompt:
      file: steps/ticket/plan.md
    agent: planner
    permissions: *a1
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: implement
      changes-requested: plan
      workspace-refresh: prepare-workspace
      retry: plan
      blocked: $pause
  implement:
    title: Implement the approved Jira plan
    prompt:
      file: steps/ticket/implement.md
    agent: worker
    permissions: *a1
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify Jira work
    prompt:
      file: steps/ticket/verify.md
    agent: reviewer
    permissions: *a1
    transitions:
      passed: $done
      failed: implement
      retry: verify
      blocked: verify
