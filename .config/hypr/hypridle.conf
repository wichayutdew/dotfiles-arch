general {
		lock_cmd = pidof swaylock || swaylock

		# Lock on ANY sleep (lid-close suspend is handled by logind; this hooks the
		# PrepareForSleep event so the session is locked when the lid closes).
		before_sleep_cmd = loginctl lock-session
		# Wake the display on resume — s2idle on AMD leaves the screen off otherwise.
		after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300
    on-timeout = pidof swaylock || swaylock
}
